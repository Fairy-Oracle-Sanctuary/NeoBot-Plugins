name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugins repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Clone NeoBot framework (contract namespace)
        uses: actions/checkout@v4
        with:
          repository: Fairy-Oracle-Sanctuary/NeoBot
          path: _neobot
          fetch-depth: 1

      - name: Install dependencies
        run: |
          pip install -r _neobot/requirements.txt ruff
          pip install -r _neobot/requirements-dev.txt 2>/dev/null || true

      - name: Validate manifests + contract boundary
        run: python3 scripts/validate_plugins.py --check-only

      - name: Ruff lint (plugins + template + scripts)
        run: ruff check plugins/ template/ scripts/ --output-format=concise

      - name: Compile check
        run: |
          find plugins template -name '*.py' -exec python3 -m py_compile {} +

  test:
    name: Plugin tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout plugins repo
        uses: actions/checkout@v4

      - name: Clone NeoBot framework
        uses: actions/checkout@v4
        with:
          repository: Fairy-Oracle-Sanctuary/NeoBot
          path: _neobot
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r _neobot/requirements.txt pytest pytest-asyncio

      - name: Prepare framework config (config_loader requires config.toml)
        run: |
          cp _neobot/config.example.toml config.toml

      - name: Run plugin tests / import check
        run: |
          export PYTHONPATH="$PWD:$PWD/plugins:$PWD/_neobot/src"
          python3 scripts/ci_test_plugins.py

  index:
    name: Generate plugin index
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate index.json
        run: python3 scripts/validate_plugins.py

      - name: Commit index if changed
        run: |
          if git diff --quiet index.json; then
            echo "index.json 无变化"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: regenerate plugin index [skip ci]"
            git push
          fi
